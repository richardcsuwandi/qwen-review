[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen-review"
version = "0.1.0"
description = "Local pre-submission checker for LaTeX papers. Flags undefined acronyms, inconsistent notation and unsupported claims with Qwen3 on Ollama."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Richard Cornelius Suwandi" }]
keywords = ["latex", "paper", "review", "qwen", "ollama", "pre-submission"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
qwen-review = "qwen_review.cli:main"

[project.urls]
Homepage = "https://github.com/richardcsuwandi/qwen-review"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
